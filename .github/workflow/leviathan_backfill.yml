name: LEVIATHAN One-Time 10-Year Historical Backfill

on:
  workflow_dispatch:

jobs:
  execute-leviathan-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install yfinance pandas numpy google-cloud-bigquery

      - name: Execute 10-Year Backfill Stream
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python leviathan_backfill_10y.py
        
